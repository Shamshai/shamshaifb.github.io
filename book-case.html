<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book Case | ABC Fabrication</title>

<style>
/* ================= THEME VARIABLES ================= */
:root{
  --bg:#020617;
  --text:#ffffff;
  --card:rgba(255,255,255,.08);
  --accent:#f59e0b;
}
.light{
  --bg:#ffffff;
  --text:#000000;
  --card:#f2f2f2;
  --accent:#000000;
}

/* ================= GLOBAL ================= */
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  transition:.3s;
  display:flex;
  flex-direction:column;
  min-height:100vh;
}

/* ================= HEADER ================= */
header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(0,0,0,.85);
  padding:14px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.light header{
  background:#ffffff;
  border-bottom:1px solid #ddd;
}
.logo{
  font-size:20px;
  font-weight:bold;
}
.logo a{
  color:var(--text);
  text-decoration:none;
}
nav a{
  color:var(--text);
  text-decoration:none;
  margin-left:22px;
  font-weight:bold;
}
nav a:hover{color:var(--accent)}

/* ================= THEME TOGGLE ================= */
.theme-toggle{
  background:none;
  border:none;
  font-size:22px;
  cursor:pointer;
  color:var(--text);
  margin-left:16px;
}

/* ================= FULL WIDTH SLIDER ================= */
.slider{
  width:100vw;
  height:75vh;
  overflow:hidden;
  position:relative;
}
.slides{
  display:flex;
  height:100%;
  transition:.5s ease;
}
.slide{
  min-width:100vw;
}
.slide img{
  width:100%;
  height:100%;
  object-fit:contain;     /* prevents cropping */
  background:#000;        /* optional: fills empty space */
}
.slider-btn{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  background:rgba(0,0,0,.6);
  color:#fff;
  border:none;
  font-size:28px;
  padding:10px 16px;
  cursor:pointer;
  z-index:20;
}
.prev{left:10px}
.next{right:10px}

/* ================= PAGE TITLE ================= */
.page-title{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  z-index:15;
  background:rgba(0,0,0,.6);
  padding:18px 40px;
  border-radius:16px;
}
.page-title h1{
  margin:0;
  font-size:42px;
  color:var(--accent);
  letter-spacing:2px;
}
@media(max-width:768px){
  .page-title h1{font-size:28px}
  .slider{height:55vh}
}

/* ================= POPUP ================= */
.popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.9);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
}
.popup img{
  max-width:95%;
  max-height:90%;
  border-radius:12px;
}

/* ================= CONTACT ================= */
section{
  padding:60px 20px;
}
h2{
  text-align:center;
  color:var(--accent);
}
.contact-wrapper{
  max-width:1000px;
  margin:auto;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:30px;
}
.contact-box,.map-card{
  background:var(--card);
  padding:26px;
  border-radius:16px;
}
.contact-box input,
.contact-box textarea{
  width:100%;
  padding:12px;
  margin-bottom:14px;
  border:none;
  border-radius:6px;
}
.contact-box button{
  width:100%;
  background:var(--accent);
  color:#000;
  padding:12px;
  font-weight:bold;
  border:none;
  border-radius:6px;
}

/* ================= MAP ================= */
.map-iframe{
  width:100%;
  height:100%;
  min-height:350px;
  border:0;
  border-radius:12px;
}

/* ================= FOOTER ================= */
footer{
  text-align:center;
  padding:16px;
  background:rgba(0,0,0,.8);
  color:#fff;
  font-size:14px;
  margin-top:auto;
}
footer a{
  color:#f59e0b;
  text-decoration:none;
  font-weight:bold;
}
footer a:hover{text-decoration:underline}

/* ================= FLOATING ================= */
.whatsapp,.call{
  position:fixed;
  bottom:20px;
  width:56px;
  height:56px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:26px;
  text-decoration:none;
  z-index:9999;
}
.whatsapp{right:20px;background:#25D366;color:#fff}
.call{left:20px;background:var(--accent);color:#000}

@media(max-width:768px){
  .contact-wrapper{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
  <div class="logo">
    <a href="https://shamshai.github.io/shamshaifb.github.io/index.html">
      ABC Fabrication
    </a>
  </div>

  <nav>
    <a href="https://shamshai.github.io/shamshaifb.github.io/index.html">Home</a>
    <a href="https://shamshai.github.io/shamshaifb.github.io/index.html#about">About</a>
    <a href="https://shamshai.github.io/shamshaifb.github.io/index.html#services">Services</a>
    <a href="https://shamshai.github.io/shamshaifb.github.io/index.html#projects">Projects</a>
    <a href="https://shamshai.github.io/shamshaifb.github.io/contact-us.html">Contact us</a>
    <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
  </nav>
</header>

<!-- ================= SLIDER ================= -->
<div class="slider">

  <div class="page-title">
    <h1>Book Case</h1>
  </div>

  
  <div class="slides" id="slides">
    <div class="slide"><img src="Book Case/1st.jpg"></div>
    <div class="slide"><img src="Book Case/6th.jpg"></div>
    <div class="slide"><img src="Book Case/5th.jpg"></div>
    <div class="slide"><img src="Book Case/7th.jpg"></div>
    <div class="slide"><img src="Book Case/2nd.jpg"></div>
    <div class="slide"><img src="Book Case/8th.jpg"></div>
    <div class="slide"><img src="Book Case/3rd.jpg"></div>
    <div class="slide"><img src="Book Case/4th.jpg"></div>
  </div>


  <button class="slider-btn prev" onclick="move(-1)">❮</button>
  <button class="slider-btn next" onclick="move(1)">❯</button>
</div>

<!-- POPUP -->
<div class="popup" id="popup" onclick="this.style.display='none'">
  <img id="popupImg">
</div>

<!-- ================= CONTACT ================= -->
<section id="contact">
<h2>Contact Us</h2>

<div class="contact-wrapper">
  <div class="contact-box">
    <input placeholder="Your Name">
    <input placeholder="Phone / WhatsApp">
    <textarea placeholder="Project Details"></textarea>
    <button>Send via WhatsApp</button>
  </div>

  <div class="map-card">
    <iframe class="map-iframe" loading="lazy"
      src="https://www.google.com/maps?q=17.368611,78.448067&z=16&output=embed">
    </iframe>
  </div>
</div>
</section>

<footer>
  © 2025 ABC Fabrication Works |
  Call us: <a href="tel:+919731652936">+91 97316 52936</a>
</footer>

<a class="whatsapp" href="https://wa.me/919731652936">🟢</a>
<a class="call" href="tel:9731652936">📞</a>

<script>
let i=0;
const slides=document.getElementById("slides");
const total=slides.children.length;

function move(n){
  i=(i+n+total)%total;
  slides.style.transform=`translateX(-${i*100}vw)`;
}

let startX=0;
slides.addEventListener("touchstart",e=>startX=e.touches[0].clientX);
slides.addEventListener("touchend",e=>{
  let diff=e.changedTouches[0].clientX-startX;
  if(diff>50)move(-1);
  if(diff<-50)move(1);
});

document.querySelectorAll(".slide img").forEach(img=>{
  img.onclick=()=>{
    popupImg.src=img.src;
    popup.style.display="flex";
  }
});

function toggleTheme(){
  document.body.classList.toggle("light");
  document.querySelector(".theme-toggle").textContent =
    document.body.classList.contains("light") ? "☀" : "🌙";
}
</script>

</body>
</html>
