<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shams Engineering Works</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: #0f172a;
  color: #fff;
}

/* HEADER */
header {
  background: #020617;
  padding: 10px 15px;
}

.header-top {
  display: flex;
  align-items: center;
  gap: 10px;
}

.header-top img {
  width: 45px;
}

.brand {
  font-size: 20px;
  font-weight: bold;
}

nav {
  margin-top: 10px;
}

nav ul {
  display: flex;
  flex-wrap: wrap;
  gap: 15px;
  list-style: none;
}

nav a {
  color: white;
  text-decoration: none;
  font-weight: bold;
}

/* SECTIONS */
section {
  padding: 50px 20px;
}

.section-title {
  text-align: center;
  margin-bottom: 30px;
}

.section-title h2 {
  color: #f59e0b;
}

/* SERVICES */
.services-grid,
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 20px;
}

.card {
  background: #020617;
  border-radius: 10px;
  overflow: hidden;
}

.card img {
  width: 100%;
  height: 180px;
  object-fit: cover;
}

.card h3 {
  padding: 15px;
  text-align: center;
}

/* PROJECT LOGOS */
.grid img {
  background: white;
  padding: 20px;
  border-radius: 10px;
  height: 140px;
  object-fit: contain;
}

/* FOOTER */
footer {
  background: #020617;
  text-align: center;
  padding: 25px;
}

footer a {
  color: #f59e0b;
  text-decoration: none;
  font-weight: bold;
}
</style>
</head>
