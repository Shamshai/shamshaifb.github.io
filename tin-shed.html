<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ABC Fabrication | Steel & Tin Shed Experts</title>
<meta name="description" content="Steel fabrication, tin shed roofing, industrial structures & custom metal works in Hyderabad.">

<style>
/* ================= GLOBAL ================= */
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#020617;
  color:#fff;
}

/* ================= HEADER ================= */
header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(0,0,0,.85);
  padding:14px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
nav a{
  color:#fff;
  margin-left:16px;
  text-decoration:none;
  font-weight:bold;
}
nav a:hover{color:#f59e0b}

/* ================= FULL WIDTH SLIDER ================= */
.slider{
  position:relative;
  width:100%;
  overflow:hidden;
  height:70vh;
}
.slides{
  display:flex;
  height:100%;
  transition:transform .5s ease;
}
.slide{
  min-width:100%;
  height:100%;
}
.slide img{
  width:100%;
  height:100%;
  object-fit:cover;
  cursor:pointer;
}

/* Buttons */
.slider-btn{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  background:rgba(0,0,0,.6);
  color:#fff;
  border:none;
  font-size:28px;
  padding:10px 16px;
  cursor:pointer;
  z-index:10;
}
.prev{left:10px}
.next{right:10px}

/* ================= POPUP ================= */
.popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.9);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:99999;
}
.popup img{
  max-width:95%;
  max-height:90%;
  border-radius:10px;
}

/* ================= CONTACT ================= */
section{padding:50px 20px}
h2{text-align:center;color:#f59e0b}

.contact-box{
  max-width:600px;
  margin:auto;
  background:rgba(255,255,255,.08);
  padding:26px;
  border-radius:16px;
}
.contact-box input,.contact-box textarea{
  width:100%;
  padding:12px;
  margin-bottom:14px;
  border:none;
  border-radius:6px;
}
.contact-box button{
  background:#f59e0b;
  color:#000;
  padding:12px;
  width:100%;
  font-weight:bold;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

/* ================= MAP ================= */
.map-iframe{
  width:100%;
  height:350px;
  border:0;
  border-radius:16px;
  margin-top:30px;
}

/* ================= FLOATING ICONS ================= */
.whatsapp,
.call{
  position:fixed;
  bottom:20px;
  width:56px;
  height:56px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:26px;
  color:#fff;
  text-decoration:none;
  z-index:9999;
}
.whatsapp{
  right:20px;
  background:#25D366;
}
.call{
  left:20px;
  background:#f59e0b;
  color:#000;
}

/* ================= MOBILE ================= */
@media(max-width:768px){
  .slider{height:55vh}
}
</style>
</head>

<body>

<header>
  <strong>ABC Fabrication</strong>
  <nav>
    <a href="#contact">Contact</a>
  </nav>
</header>

<!-- ================= FULL WIDTH SLIDER ================= -->
<div class="slider" id="slider">
  <div class="slides" id="slides">
    <div class="slide"><img src="Tin Shed work, Roofing sheet with puff panels/1st.jpg"></div>
    <div class="slide"><img src="Tin Shed work, Roofing sheet with puff panels/2nd.jpg"></div>
    <div class="slide"><img src="Tin Shed work, Roofing sheet with puff panels/3rd.jpg"></div>
    <div class="slide"><img src="Tin Shed work, Roofing sheet with puff panels/5th.jpg"></div>
    <div class="slide"><img src="Tin Shed work, Roofing sheet with puff panels/6th.jpg"></div>
  </div>

  <button class="slider-btn prev" onclick="move(-1)">❮</button>
  <button class="slider-btn next" onclick="move(1)">❯</button>
</div>

<!-- ================= POPUP ================= -->
<div class="popup" id="popup" onclick="closePopup()">
  <img id="popupImg">
</div>

<!-- ================= CONTACT ================= -->
<section id="contact">
<h2>Contact Us</h2>

<div class="contact-box">
  <input placeholder="Your Name">
  <input placeholder="Phone / WhatsApp">
  <textarea placeholder="Project Details"></textarea>
  <button>Send via WhatsApp</button>
</div>

<iframe 
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3806.243470299947!2d78.44806677455044!3d17.36861128805651!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bcb9130d3b32fbf%3A0x8fefc4a061d928df!2sAkbarpura%2C%20Toli%20Chowki%2C%20Hyderabad%2C%20Telangana%20500008!5e0!3m2!1sen!2sin!4v1703701443740!5m2!1sen!2sin" 
      allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
    </iframe>
</section>

<!-- ================= FLOATING BUTTONS ================= -->
<a class="whatsapp" href="https://wa.me/919731652936">🟢</a>
<a class="call" href="tel:9731652936">📞</a>

<script>
/* ================= SLIDER ================= */
let index=0;
const slides=document.getElementById("slides");
const total=slides.children.length;

function update(){
  slides.style.transform=`translateX(-${index*100}%)`;
}
function move(n){
  index=(index+n+total)%total;
  update();
}

/* Swipe */
let startX=0;
slides.addEventListener("touchstart",e=>startX=e.touches[0].clientX);
slides.addEventListener("touchend",e=>{
  let diff=e.changedTouches[0].clientX-startX;
  if(diff>50) move(-1);
  if(diff<-50) move(1);
});

/* Popup */
document.querySelectorAll(".slide img").forEach(img=>{
  img.onclick=()=>{
    document.getElementById("popupImg").src=img.src;
    document.getElementById("popup").style.display="flex";
  };
});
function closePopup(){
  document.getElementById("popup").style.display="none";
}
</script>

</body>
</html>
