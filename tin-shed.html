<script>
function setBG(cls){document.body.className=cls;}

let i=0;
const slides=document.getElementById("slides");
const total=slides.children.length;
const dots=document.getElementById("dots");

for(let d=0;d<total;d++){
  const dot=document.createElement("div");
  dot.className="dot";
  dot.onclick=()=>{i=d;update();}
  dots.appendChild(dot);
}

function update(){
  slides.style.transform=`translateX(-${i*100}%)`;
  document.querySelectorAll(".dot")
    .forEach((d,x)=>d.classList.toggle("active",x===i));
}
function move(n){i=(i+n+total)%total;update();}
update();

function sendWhatsApp(){
  const text=`Name:${name.value}%0APhone:${phone.value}%0AMessage:${msg.value}`;
