<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ABC Fabrication | Steel & Tin Shed Experts</title>
<meta name="description" content="Steel fabrication, tin shed roofing, industrial structures & custom metal works in Hyderabad.">

<style>
/* ================= GLOBAL ================= */
*{box-sizing:border-box;}
body{
  margin:0;font-family:Arial,sans-serif;
  background:#020617;color:#fff;
}
h1,h2{text-align:center;color:#f59e0b;margin-bottom:24px;}

/* ================= HEADER ================= */
header{
  position:sticky;top:0;z-index:1000;
  background:rgba(0,0,0,.85);
  padding:14px 20px;
  display:flex;justify-content:space-between;align-items:center;
}
nav a{
  color:#fff;margin-left:16px;
  text-decoration:none;font-weight:bold;
}
nav a:hover{color:#f59e0b;}

/* ================= MAIN ================= */
section{padding:60px 16px;}

/* ================= CARD SCROLL GALLERY ================= */
.gallery-wrapper{
  max-width:1200px;
  margin:auto;
  overflow-x:auto;
  display:flex;
  gap:18px;
  padding:10px;
  scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;
}
.gallery-wrapper::-webkit-scrollbar{display:none;}

.gallery-card{
  min-width:280px;
  max-width:280px;
  height:200px;
  background:#020617;
  border-radius:16px;
  overflow:hidden;
  scroll-snap-align:start;
  box-shadow:0 10px 25px rgba(0,0,0,.4);
  cursor:pointer;
  transition:transform .3s ease;
}
.gallery-card:hover{transform:scale(1.05);}

.gallery-card img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

/* ================= POPUP MODAL ================= */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.9);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
}
.modal img{
  max-width:92%;
  max-height:92%;
  border-radius:14px;
}

/* ================= CONTACT ================= */
.contact-box{
  max-width:600px;margin:auto;
  background:rgba(255,255,255,.08);
  padding:26px;border-radius:16px;
}
.contact-box input,.contact-box textarea{
  width:100%;padding:12px;margin-bottom:14px;
  border-radius:6px;border:none;
}
.contact-box button{
  background:#f59e0b;color:#000;
  padding:12px 18px;border:none;
  border-radius:6px;font-weight:bold;
}

/* ================= MAP ================= */
.map-iframe{
  width:100%;
  height:350px;
  border:0;
  border-radius:16px;
  margin-top:30px;
}

/* ================= FLOATING ================= */
.whatsapp{
  position:fixed;right:18px;bottom:18px;
  width:56px;height:56px;
  background:#25D366;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:26px;z-index:999;
}
</style>
</head>

<body>

<header>
  <strong>ABC Fabrication</strong>
  <nav>
    <a href="#projects">Projects</a>
    <a href="#contact">Contact</a>
  </nav>
</header>

<!-- ================= PROJECTS ================= -->
<section id="projects">
<h1>Tin Shed & Roofing Projects</h1>

<div class="gallery-wrapper">
  <div class="gallery-card"><img src="Tin Shed work, Roofing sheet with puff panels/1st.jpg"></div>
  <div class="gallery-card"><img src="Tin Shed work, Roofing sheet with puff panels/2nd.jpg"></div>
  <div class="gallery-card"><img src="Tin Shed work, Roofing sheet with puff panels/3rd.jpg"></div>
  <div class="gallery-card"><img src="Tin Shed work, Roofing sheet with puff panels/5th.jpg"></div>
  <div class="gallery-card"><img src="Tin Shed work, Roofing sheet with puff panels/6th.jpg"></div>
  <div class="gallery-card"><img src="Tin Shed work, Roofing sheet with puff panels/8th.jpg"></div>
  <div class="gallery-card"><img src="Tin Shed work, Roofing sheet with puff panels/9th.jpg"></div>
</div>
</section>

<!-- ================= CONTACT ================= -->
<section id="contact">
<h2>Contact Us</h2>

<div class="contact-box">
  <input id="name" placeholder="Your Name">
  <input id="phone" placeholder="Phone / WhatsApp Number">
  <textarea id="msg" placeholder="Project Details"></textarea>
  <button onclick="sendWhatsApp()">Send via WhatsApp</button>
</div>

<iframe
  class="map-iframe"
  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3806.243470299947!2d78.44806677455044!3d17.36861128805651!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bcb9130d3b32fbf%3A0x8fefc4a061d928df!2sAkbarpura%2C%20Toli%20Chowki%2C%20Hyderabad%2C%20Telangana%20500008!5e0!3m2!1sen!2sin!4v1703701443740!5m2!1sen!2sin"
  loading="lazy" referrerpolicy="no-referrer-when-downgrade">
</iframe>
</section>

<!-- ================= MODAL ================= -->
<div class="modal" id="modal">
  <img id="modalImg">
</div>

<a class="whatsapp" href="https://wa.me/919731652936" target="_blank">🟢</a>

<script>
/* ===== IMAGE POPUP ===== */
const modal=document.getElementById("modal");
const modalImg=document.getElementById("modalImg");

document.querySelectorAll(".gallery-card img").forEach(img=>{
  img.onclick=()=>{
    modal.style.display="flex";
    modalImg.src=img.src;
  }
});
modal.onclick=()=>modal.style.display="none";

/* ===== WHATSAPP ===== */
function sendWhatsApp(){
  const text=`Name:${name.value}%0APhone:${phone.value}%0AMessage:${msg.value}`;
  window.open(`https://wa.me/919731652936?text=${text}`,'_blank');
}
</script>

</body>
</html>
