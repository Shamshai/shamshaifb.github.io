<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ABC Fabrication | Steel & Tin Shed Experts</title>
<meta name="description" content="Steel fabrication, tin shed roofing, industrial structures & custom metal works in Hyderabad.">

<style>
/* ================= GLOBAL ================= */
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#020617;
  color:#fff;
}

/* ================= HEADER ================= */
header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(0,0,0,.85);
  padding:14px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
nav a{
  color:#fff;
  margin-left:16px;
  text-decoration:none;
  font-weight:bold;
}
nav a:hover{color:#f59e0b}

/* ================= FULL WIDTH SLIDER ================= */
.slider{
  position:relative;
  width:100%;
  height:70vh;
  overflow:hidden;
}
.slides{
  display:flex;
  height:100%;
  transition:transform .5s ease;
}
.slide{
  min-width:100%;
}
.slide img{
  width:100%;
  height:100%;
  object-fit:cover;
  cursor:pointer;
}

/* Slider Buttons */
.slider-btn{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  background:rgba(0,0,0,.6);
  color:#fff;
  border:none;
  font-size:28px;
  padding:10px 16px;
  cursor:pointer;
}
.prev{left:10px}
.next{right:10px}

/* ================= POPUP ================= */
.popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.9);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
}
.popup img{
  max-width:95%;
  max-height:90%;
  border-radius:12px;
}

/* ================= CONTACT ================= */
section{
  padding:60px 20px;
}
h2{
  text-align:center;
  color:#f59e0b;
  margin-bottom:30px;
}

.contact-wrapper{
  max-width:1000px;
  margin:auto;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:30px;
}

.contact-box{
  background:rgba(255,255,255,.08);
  padding:26px;
  border-radius:16px;
}
.contact-box input,
.contact-box textarea{
  width:100%;
  padding:12px;
  margin-bottom:14px;
  border:none;
  border-radius:6px;
}
.contact-box button{
  width:100%;
  background:#f59e0b;
  color:#000;
  padding:12px;
  font-weight:bold;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

/* ================= MAP ================= */
.map-card{
  background:rgba(255,255,255,.08);
  padding:10px;
  border-radius:16px;
}
.map-iframe{
  width:100%;
  height:100%;
  min-height:350px;
  border:0;
  border-radius:12px;
}

/* ================= FLOATING ICONS ================= */
.whatsapp,
.call{
  position:fixed;
  bottom:20px;
  width:56px;
  height:56px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:26px;
  text-decoration:none;
  z-index:9999;
}
.whatsapp{
  right:20px;
  background:#25D366;
  color:#fff;
}
.call{
  left:20px;
  background:#f59e0b;
  color:#000;
}

/* ================= MOBILE ================= */
@media(max-width:768px){
  .slider{height:55vh}
  .contact-wrapper{
    grid-template-columns:1fr;
  }
  .map-iframe{
    min-height:300px;
  }
}
</style>
</head>

<body>

<header>
  <strong>ABC Fabrication</strong>
  <nav>
    <a href="#contact">Contact</a>
  </nav>
</header>

<!-- ================= SLIDER ================= -->
<div class="slider">
  <div class="slides" id="slides">
    <div class="slide"><img src="Tin Shed work, Roofing sheet with puff panels/1st.jpg"></div>
    <div class="slide"><img src="Tin Shed work, Roofing sheet with puff panels/2nd.jpg"></div>
    <div class="slide"><img src="Tin Shed work, Roofing sheet with puff panels/3rd.jpg"></div>
    <div class="slide"><img src="Tin Shed work, Roofing sheet with puff panels/5th.jpg"></div>
  </div>
  <button class="slider-btn prev" onclick="move(-1)">❮</button>
  <button class="slider-btn next" onclick="move(1)">❯</button>
</div>

<!-- Popup -->
<div class="popup" id="popup" onclick="this.style.display='none'">
  <img id="popupImg">
</div>

<!-- ================= CONTACT ================= -->
<section id="contact">
<h2>Contact Us</h2>

<div class="contact-wrapper">

  <div class="contact-box">
    <input placeholder="Your Name">
    <input placeholder="Phone / WhatsApp">
    <textarea placeholder="Project Details"></textarea>
    <button>Send via WhatsApp</button>
  </div>

  <div class="map-card">
    <iframe
      class="map-iframe"
      loading="lazy"
      referrerpolicy="no-referrer-when-downgrade"
      src="https://www.google.com/maps?q=17.368611,78.448067&hl=en&z=16&output=embed">
    </iframe>
  </div>

</div>
</section>

<!-- Floating Buttons -->
<a class="whatsapp" href="https://wa.me/919731652936">🟢</a>
<a class="call" href="tel:9731652936">📞</a>

<script>
/* Slider */
let i=0;
const slides=document.getElementById("slides");
const total=slides.children.length;

function move(n){
  i=(i+n+total)%total;
  slides.style.transform=`translateX(-${i*100}%)`;
}

/* Swipe */
let startX=0;
slides.addEventListener("touchstart",e=>startX=e.touches[0].clientX);
slides.addEventListener("touchend",e=>{
  let diff=e.changedTouches[0].clientX-startX;
  if(diff>50) move(-1);
  if(diff<-50) move(1);
});

/* Popup */
document.querySelectorAll(".slide img").forEach(img=>{
  img.onclick=()=>{
    document.getElementById("popupImg").src=img.src;
    document.getElementById("popup").style.display="flex";
  }
});
</script>

</body>
</html>
