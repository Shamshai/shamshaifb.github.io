<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tin Shed & Roofing Projects | ABC Fabrication</title>

<style>
body{
  background:#111827;
  color:#fff;
  font-family:Arial;
  margin:0;
}

header{
  background:#000;
  padding:15px 30px;
}

header a{
  color:#f59e0b;
  font-weight:bold;
}

section{
  padding:60px 30px;
}

h1{
  text-align:center;
  color:#f59e0b;
  margin-bottom:40px;
}

.masonry{
  column-count:3;
  column-gap:15px;
}

.masonry img{
  width:100%;
  margin-bottom:15px;
  border-radius:10px;
  cursor:pointer;
}

.lightbox{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.9);
  align-items:center;
  justify-content:center;
  z-index:2000;
}

.lightbox img{
  max-width:90%;
  max-height:90%;
}

@media(max-width:768px){
  .masonry{column-count:1}
}
</style>
</head>

<body>

<header>
  <a href="index.html">← Back to Home</a>
</header>

<section>
<h1>Tin Shed & Roofing Sheet Projects</h1>

<div class="masonry">
  <img src="Tin Shed work, Roofing sheet with puff panels/1st.jpg" onclick="openImg(this)">
  <img src="Tin Shed work, Roofing sheet with puff panels/2nd.jpg" onclick="openImg(this)">
  <img src="Tin Shed work, Roofing sheet with puff panels/3rd.jpg" onclick="openImg(this)">
  <img src="Tin Shed work, Roofing sheet with puff panels/5th.jpg" onclick="openImg(this)">
  <img src="Tin Shed work, Roofing sheet with puff panels/6th.jpg" onclick="openImg(this)">
  <img src="Tin Shed work, Roofing sheet with puff panels/8th.jpg" onclick="openImg(this)">
  <img src="Tin Shed work, Roofing sheet with puff panels/9th.jpg" onclick="openImg(this)">
</div>
</section>

<div class="lightbox" id="lightbox" onclick="this.style.display='none'">
  <img id="lightboxImg">
</div>

<script>
function openImg(img){
  document.getElementById("lightboxImg").src = img.src;
  document.getElementById("lightbox").style.display = "flex";
}
</script>

</body>
</html>
